    title: "O que são Reações?"
    description: "É possível reagir às publicações com diversos emojis. Reações permitem que você expresse sutilezas que não são possíveis apenas com uma curtida."
    letsTryReacting: "Reações podem ser adicionadas clicando no botão \"+\". Tente reagir à publicação de exemplo."
    reactToContinue: "Adicione uma reação para continuar."
    reactNotification: "Você receberá notificações em tempo real quando alguém reagir à sua publicação."
    reactDone: "Você pode desfazer uma reação ao selecionar o botão \"-\"."
  _timeline:
    title: "Como funcionam os feeds"
    description1: "O Misskey oferece vários feeds para diferentes usos. Alguns podem estar indisponíveis, dependendo das configurações do servidor."
    home: "Você pode ver as publicações das contas que segue."
    local: "Você pode ver publicações de todos os usuários dessa rede."
    social: "Exibe as publicações de Seguindo e do Feed geral."
    global: "Você pode ver publicações de todos os servidores conectados."
    description2: "Você pode alternar entre os feeds no topo da tela a qualquer momento."
    description3: "Também há feeds de \"listas\" e \"comunidades\". Para mais informações, acesse {link}."
  _postNote:
    title: "Opções de publicação"
    description1: "Ao criar uma publicação no Misskey, você tem várias opções disponíveis. Veja como é o formulário de publicação:"
    _visibility:
      description: "Você pode limitar quem vê a sua publicação."
      public: "Sua publicação será visível a todos os usuários."
      home: "A publicação aparece apenas no feed Seguindo. Seus seguidores e as pessoas que acessarem seu perfil ou encontrarem uma republicação também poderão vê-la."
      followers: "A publicação fica visível apenas para seus seguidores e não pode ser republicada por outras pessoas."
      direct: "Visível apenas para usuários específicos, e o destinatário será notificado. Pode ser usado como uma alternativa às mensagens diretas."
      doNotSendConfidencialOnDirect1: "Tenha cuidado ao enviar informações sensíveis!"
      doNotSendConfidencialOnDirect2: "Administradores do servidor podem ver o que foi escrito. Cuidado, também, ao enviar publicações diretas a usuários de servidores não confiáveis."
      localOnly: "Com esta opção, a publicação não será enviada a outros servidores pela federação. Os usuários desses servidores não poderão vê-la diretamente, independentemente das opções de visibilidade acima."
    _cw:
      title: "Aviso de Conteúdo"
      description: "O texto da caixa \"anotação\" será exibido no lugar do conteúdo da publicação. Clique em \"Carregar mais\" para revelar o conteúdo."
      _exampleNote:
        cw: "Isso vai dar fome!"
        note: "Acabei de comer um donut coberto de chocolate! 🍩😋"
      useCases: "Use este recurso ao tratar de assuntos que exijam cuidado segundo as regras do servidor ou ao publicar conteúdo sensível ou spoilers."
