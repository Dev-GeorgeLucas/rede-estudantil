    method: "Para marcar um anexo como sensível, clique na miniatura, abra o menu e selecione \"Marcar como sensível\"."
    sensitiveSucceeded: "Ao anexar arquivos, marque-os como sensíveis quando necessário, de acordo com as regras da instância."
    doItToContinue: "Marque o anexo como sensível para prosseguir."
