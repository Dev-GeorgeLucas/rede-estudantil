_sensitiveMediaDetection:
  description: "Use o aprendizado de máquina para detectar automaticamente mídias sensíveis para moderação. Isso pode aumentar ligeiramente a carga no servidor."
  sensitivity: "Detecção de sensibilidade"
  sensitivityDescription: "Ao reduzir a sensibilidade, as detecções incorretas (falsos positivos) diminuem. Ao aumentar a sensibilidade, as falhas de detecção (falsos negativos) diminuem."
  setSensitiveFlagAutomatically: "Marcar como sensível"
  setSensitiveFlagAutomaticallyDescription: "Os resultados da detecção interna serão mantidos mesmo se essa opção estiver desligada."
  analyzeVideos: "Habilitar análise de vídeos"
  analyzeVideosDescription: "Analisar vídeos além de imagens. Isso aumenta um pouco a carga no servidor."
  externalServiceInfo: "A detecção de mídias sensíveis foi transferida para um serviço externo (sensitive-detector). Para usar esse recurso, configure o serviço separadamente e preencha os dados de conexão abaixo. Se a conexão não estiver configurada, a detecção não será realizada e as mídias serão tratadas como não sensíveis."
  apiUrl: "URL do serviço de detecção"
  apiUrlDescription: "URL base do serviço sensitive-detector (ex.: http://localhost:3009). Se o serviço estiver em uma rede privada, permita o acesso à rede em allowedPrivateNetworks no arquivo de configuração. Se usar um proxy, configure também proxyBypassHosts. Se este campo ficar vazio, a detecção de mídias sensíveis não será realizada."
  apiKey: "Chave de API"
  apiKeyDescription: "Preencha se o serviço de detecção exigir autenticação com token Bearer. Caso contrário, deixe em branco."
  timeout: "Tempo limite (milissegundos)"
  timeoutDescription: "Tempo limite de cada solicitação de detecção."
  maxImagesPerRequest: "Máximo de imagens por solicitação"
  maxImagesPerRequestDescription: "Número máximo de imagens enviadas em uma única solicitação ao processar vários quadros, como em vídeos. As imagens que excederem esse limite serão divididas em grupos e enviadas sequencialmente. Este valor não deve ultrapassar a configuração maxParts do serviço de detecção (padrão: 10). Se ultrapassar, todas as imagens do grupo serão tratadas como não sensíveis."
