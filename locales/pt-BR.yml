  _landing:
    title: "Bem-vindo ao Tutorial!"
    description: "Aqui, você pode aprender o básico de como usar o Misskey e as suas funções."
  _note:
    title: "O que é uma publicação?"
    description: "No Misskey, você compartilha conteúdo por meio de publicações. Elas aparecem em ordem cronológica no feed, que é atualizado em tempo real."
